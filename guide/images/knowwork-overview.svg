<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img" aria-label="DeepSeek Harness 加上企业层，就是 KnowWork">
<title>DeepSeek Harness 加上企业层，就是 KnowWork</title>
<style>
.card{fill:#ffffff;stroke:#e3e8ef}
.kernel{fill:#f4f6f9;stroke:#d5dbe3}
.layer{fill:#f3f8ff;stroke:#b9d3f5}
.tile{fill:#ffffff;stroke:#d9e2ee}
.t1{fill:#1d2433}
.t2{fill:#5b6475}
.op{fill:#8b95a5}
.dot{fill:#2b7de9}
.hollow{fill:none;stroke:#2b7de9;stroke-width:1.5}
.pill{fill:#fff3dc}
.pilltext{fill:#9a5b00}
@media (prefers-color-scheme: dark){
.card{fill:#0d1117;stroke:#30363d}
.kernel{fill:#161b22;stroke:#30363d}
.layer{fill:#0f1b2d;stroke:#1f4475}
.tile{fill:#161b22;stroke:#30363d}
.t1{fill:#e6edf3}
.t2{fill:#9198a1}
.op{fill:#6e7681}
.dot{fill:#4493f8}
.hollow{fill:none;stroke:#4493f8;stroke-width:1.5}
.pill{fill:#3b2a0e}
.pilltext{fill:#f0b455}
}
</style>
<rect x="0.5" y="0.5" width="959" height="439" rx="16" class="card"/>
<text x="112.0" y="44" class="t2" font-size="13" font-weight="500" text-anchor="middle">Agent 内核</text>
<text x="480.0" y="44" class="t2" font-size="13" font-weight="500" text-anchor="middle">KnowWork 补上的企业层</text>
<text x="848.0" y="44" class="t2" font-size="13" font-weight="500" text-anchor="middle">开源 · Apache 2.0</text>
<rect x="24" y="64" width="176" height="332" rx="14" class="kernel"/>
<text x="112.0" y="160" class="t1" font-size="22" font-weight="700" text-anchor="middle">DeepSeek</text>
<text x="112.0" y="188" class="t1" font-size="22" font-weight="700" text-anchor="middle">Harness</text>
<text x="112.0" y="214" class="t2" font-size="13" font-weight="400" text-anchor="middle">（DSH）</text>
<line x1="52" y1="250" x2="172" y2="250" class="kernel" stroke-width="1"/>
<text x="112.0" y="278" class="t2" font-size="12" font-weight="400" text-anchor="middle">推理循环 · 工具调用</text>
<text x="112.0" y="300" class="t2" font-size="12" font-weight="400" text-anchor="middle">技能 · 子 Agent · 待办</text>
<text x="112.0" y="322" class="t2" font-size="12" font-weight="400" text-anchor="middle">官方插件与扩展点</text>
<text x="225.0" y="242.0" class="op" font-size="34" font-weight="300" text-anchor="middle">+</text>
<rect x="250" y="64" width="460" height="332" rx="14" class="layer"/>
<rect x="264" y="78" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="102" r="4" class="dot"/><text x="296" y="107" class="t1" font-size="15" font-weight="600" text-anchor="start">RBAC 权限管理</text><text x="282" y="130" class="t2" font-size="12" font-weight="400" text-anchor="start">按人、用户组、部门授权</text>
<rect x="486" y="78" width="210" height="68" rx="10" class="tile"/><circle cx="506" cy="102" r="4" class="dot"/><text x="518" y="107" class="t1" font-size="15" font-weight="600" text-anchor="start">企业沙箱</text><text x="504" y="130" class="t2" font-size="12" font-weight="400" text-anchor="start">一会话一容器，碰不到服务器</text>
<rect x="264" y="156" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="180" r="4" class="dot"/><text x="296" y="185" class="t1" font-size="15" font-weight="600" text-anchor="start">知识库</text><text x="282" y="208" class="t2" font-size="12" font-weight="400" text-anchor="start">按权限检索，引用落回原文</text>
<rect x="486" y="156" width="210" height="68" rx="10" class="tile" stroke-dasharray="5 4"/><circle cx="506" cy="180" r="4" class="hollow"/><text x="518" y="185" class="t1" font-size="15" font-weight="600" text-anchor="start">记忆层</text><text x="504" y="208" class="t2" font-size="12" font-weight="400" text-anchor="start">记住用户偏好与常用口径</text><rect x="571" y="170" width="46" height="19" rx="9.5" class="pill"/><text x="594" y="184" class="pilltext" font-size="11" font-weight="600" text-anchor="middle">规划中</text>
<rect x="264" y="234" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="258" r="4" class="dot"/><text x="296" y="263" class="t1" font-size="15" font-weight="600" text-anchor="start">模型网关</text><text x="282" y="286" class="t2" font-size="12" font-weight="400" text-anchor="start">密钥不进 DSH，用量可算</text>
<rect x="486" y="234" width="210" height="68" rx="10" class="tile"/><circle cx="506" cy="258" r="4" class="dot"/><text x="518" y="263" class="t1" font-size="15" font-weight="600" text-anchor="start">审批与审计</text><text x="504" y="286" class="t2" font-size="12" font-weight="400" text-anchor="start">写操作先批，每一步可回看</text>
<rect x="264" y="312" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="336" r="4" class="dot"/><text x="296" y="341" class="t1" font-size="15" font-weight="600" text-anchor="start">技能管控</text><text x="282" y="364" class="t2" font-size="12" font-weight="400" text-anchor="start">完成判据，专业工具按需解锁</text>
<rect x="486" y="312" width="210" height="68" rx="10" class="tile"/><circle cx="506" cy="336" r="4" class="dot"/><text x="518" y="341" class="t1" font-size="15" font-weight="600" text-anchor="start">私有化部署</text><text x="504" y="364" class="t2" font-size="12" font-weight="400" text-anchor="start">一条命令安装，国内镜像</text>
<text x="735.0" y="241.0" class="op" font-size="34" font-weight="300" text-anchor="middle">=</text>
<rect x="760" y="64" width="176" height="332" rx="14" fill="#2b7de9"/>
<g transform="translate(807.0,144.3) scale(0.32)" fill="#ffffff"><rect x="40" y="24" width="40" height="192" rx="20"/><path d="M92 120 C110 60 160 28 216 24 C212 80 170 116 92 120 Z"/><path d="M92 120 C170 124 212 160 216 216 C160 212 110 180 92 120 Z"/></g>
<text x="848.0" y="252" class="" font-size="24" font-weight="700" text-anchor="middle" fill="#ffffff">KnowWork</text>
<text x="848.0" y="282" class="" font-size="14" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.9">企业私有化</text>
<text x="848.0" y="304" class="" font-size="14" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.9">Agent 平台</text>
