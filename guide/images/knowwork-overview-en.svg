}
</style>
<rect x="0.5" y="0.5" width="959" height="439" rx="16" class="card"/>
<text x="112.0" y="44" class="t2" font-size="13" font-weight="500" text-anchor="middle">Agent kernel</text>
<text x="480.0" y="44" class="t2" font-size="13" font-weight="500" text-anchor="middle">Enterprise layer KnowWork adds</text>
<text x="848.0" y="44" class="t2" font-size="13" font-weight="500" text-anchor="middle">Open source · Apache 2.0</text>
<rect x="24" y="64" width="176" height="332" rx="14" class="kernel"/>
<text x="112.0" y="160" class="t1" font-size="22" font-weight="700" text-anchor="middle">DeepSeek</text>
<text x="112.0" y="188" class="t1" font-size="22" font-weight="700" text-anchor="middle">Harness</text>
<text x="112.0" y="214" class="t2" font-size="13" font-weight="400" text-anchor="middle">(DSH)</text>
<line x1="52" y1="250" x2="172" y2="250" class="kernel" stroke-width="1"/>
<text x="112.0" y="278" class="t2" font-size="12" font-weight="400" text-anchor="middle">Agent loop · tool calls</text>
<text x="112.0" y="300" class="t2" font-size="12" font-weight="400" text-anchor="middle">Skills · subagents · to-dos</text>
<text x="112.0" y="322" class="t2" font-size="12" font-weight="400" text-anchor="middle">Official extension points</text>
<text x="225.0" y="242.0" class="op" font-size="34" font-weight="300" text-anchor="middle">+</text>
<rect x="250" y="64" width="460" height="332" rx="14" class="layer"/>
<rect x="264" y="78" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="102" r="4" class="dot"/><text x="296" y="107" class="t1" font-size="15" font-weight="600" text-anchor="start">RBAC permissions</text><text x="282" y="130" class="t2" font-size="12" font-weight="400" text-anchor="start">Users, groups, departments</text>
<rect x="486" y="78" width="210" height="68" rx="10" class="tile"/><circle cx="506" cy="102" r="4" class="dot"/><text x="518" y="107" class="t1" font-size="15" font-weight="600" text-anchor="start">Enterprise sandbox</text><text x="504" y="130" class="t2" font-size="12" font-weight="400" text-anchor="start">One container per session</text>
<rect x="264" y="156" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="180" r="4" class="dot"/><text x="296" y="185" class="t1" font-size="15" font-weight="600" text-anchor="start">Knowledge bases</text><text x="282" y="208" class="t2" font-size="12" font-weight="400" text-anchor="start">Permission-aware, cited</text>
<rect x="486" y="156" width="210" height="68" rx="10" class="tile" stroke-dasharray="5 4"/><circle cx="506" cy="180" r="4" class="hollow"/><text x="518" y="185" class="t1" font-size="15" font-weight="600" text-anchor="start">Memory layer</text><text x="504" y="208" class="t2" font-size="12" font-weight="400" text-anchor="start">Remembers user preferences</text><rect x="622" y="170" width="58" height="19" rx="9.5" class="pill"/><text x="651" y="184" class="pilltext" font-size="11" font-weight="600" text-anchor="middle">Planned</text>
<rect x="264" y="234" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="258" r="4" class="dot"/><text x="296" y="263" class="t1" font-size="15" font-weight="600" text-anchor="start">Model gateway</text><text x="282" y="286" class="t2" font-size="12" font-weight="400" text-anchor="start">Keys never enter DSH</text>
<rect x="486" y="234" width="210" height="68" rx="10" class="tile"/><circle cx="506" cy="258" r="4" class="dot"/><text x="518" y="263" class="t1" font-size="15" font-weight="600" text-anchor="start">Approval &amp; audit</text><text x="504" y="286" class="t2" font-size="12" font-weight="400" text-anchor="start">Approvals, step replay</text>
<rect x="264" y="312" width="210" height="68" rx="10" class="tile"/><circle cx="284" cy="336" r="4" class="dot"/><text x="296" y="341" class="t1" font-size="15" font-weight="600" text-anchor="start">Skill controls</text><text x="282" y="364" class="t2" font-size="12" font-weight="400" text-anchor="start">Hard completion criteria</text>
<rect x="486" y="312" width="210" height="68" rx="10" class="tile"/><circle cx="506" cy="336" r="4" class="dot"/><text x="518" y="341" class="t1" font-size="15" font-weight="600" text-anchor="start">Self-hosted deploy</text><text x="504" y="364" class="t2" font-size="12" font-weight="400" text-anchor="start">One command, China mirrors</text>
<text x="735.0" y="241.0" class="op" font-size="34" font-weight="300" text-anchor="middle">=</text>
<rect x="760" y="64" width="176" height="332" rx="14" fill="#2b7de9"/>
