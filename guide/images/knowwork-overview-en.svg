<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img" aria-label="DeepSeek Harness plus the enterprise layer is KnowWork">
<title>DeepSeek Harness plus the enterprise layer is KnowWork</title>
<style>
.card{fill:#ffffff;stroke:#e3e8ef}
.kernel{fill:#f4f6f9;stroke:#d5dbe3}
