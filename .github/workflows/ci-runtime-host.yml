name: ci-runtime-host

# 运行时宿主：DSH 版本锁定检查 + npm test。只在 runtime-host/ 有改动时跑（省 Actions 分钟数）。

on:
  push:
    branches: [main]
    paths: ["runtime-host/**", ".github/workflows/ci-runtime-host.yml"]
  pull_request:
    paths: ["runtime-host/**", ".github/workflows/ci-runtime-host.yml"]

concurrency:
  group: ci-runtime-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-host:
    name: 运行时宿主（npm test）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime-host/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: DSH 版本锁定检查
        run: test "$(node -p "require('@deepseek-ai/dsh/package.json').version")" = "0.2.1-rc.2"
      - run: npm test
