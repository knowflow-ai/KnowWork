name: ci-runtime-host

# 运行时宿主：DSH 版本锁定检查 + npm test。只在 runtime-host/ 有改动时跑（省 Actions 分钟数）；
# 沙箱镜像装着同版本的 dsh-ssh 辅助程序（流式执行），它的 Dockerfile 改了也跑版本检查。

on:
  push:
    branches: [main]
    paths: ["runtime-host/**", "deploy/docker/sandbox.Dockerfile", ".github/workflows/ci-runtime-host.yml"]
  pull_request:
    paths: ["runtime-host/**", "deploy/docker/sandbox.Dockerfile", ".github/workflows/ci-runtime-host.yml"]

concurrency:
  group: ci-runtime-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-host:
    name: 运行时宿主（npm test）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime-host/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: DSH 版本锁定检查
        run: |
          test "$(node -p "require('@deepseek-ai/dsh/package.json').version")" = "0.2.2-alpha.2"
          # 流式执行：宿主按本机同版本文件的摘要校验沙箱镜像里的辅助程序，三处版本必须一致
          test "$(node -p "require('@deepseek-ai/dsh-ssh/package.json').version")" = "0.2.2-alpha.2"
          test "$(node -p "require('@deepseek-ai/dsh-subprocess-ssh/package.json').version")" = "0.2.2-alpha.2"
          grep -qx 'ARG DSH_VERSION=0.2.2-alpha.2' ../deploy/docker/sandbox.Dockerfile
      - run: npm test
