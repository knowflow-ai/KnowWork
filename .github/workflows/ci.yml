name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: 业务服务（ruff + pytest）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # 端到端测试会起真实宿主进程，需要 Node 与宿主依赖
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime-host/package-lock.json
      - name: 安装宿主依赖
        working-directory: runtime-host
        run: npm ci --no-audit --no-fund
      - name: 安装 Python 依赖
        run: uv sync --frozen --python 3.12
      - name: ruff
        run: uv run ruff check
      - name: pytest
        run: uv run pytest

  runtime-host:
    name: 运行时宿主（npm test）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime-host/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: DSH 版本锁定检查
        run: test "$(node -p "require('@deepseek-ai/dsh/package.json').version")" = "0.2.1-rc.2"
      - run: npm test

  web:
    name: 前端（lint + test + build）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: 部署配置校验
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: compose 配置校验
        env:
          KNOWWORK_RUSTFS_ACCESS_KEY: ci-access
          KNOWWORK_RUSTFS_SECRET_KEY: ci-secret
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sandbox.yml config --quiet
      - name: shellcheck
        run: shellcheck -s sh deploy/install.sh deploy/runtime-host/entrypoint.sh deploy/postgres/initdb/*.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "*.Dockerfile"
          recursive: true
