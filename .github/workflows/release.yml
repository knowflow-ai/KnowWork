name: release

# 打 v* 标签发布：构建四个镜像推到阿里云容器镜像服务，同步 postgres、redis、rustfs，生成 SBOM 并建 GitHub Release。
# 只在配了仓库变量 ACR_REGISTRY 的仓库里跑（公开仓库）；私有仓库打标签不会推镜像。
#
# 需要的配置：
#   变量 ACR_REGISTRY   crpi-6q638zy09wmnj70w.cn-hangzhou.personal.cr.aliyuncs.com/knowflow-ai（与 KnowFlow 同一个阿里云个人版实例，命名空间 knowflow-ai；地址加命名空间，与 deploy/.env.example 一致）
#   新仓库第一次推送时自动创建、默认私有，要在阿里云控制台改成公开，用户才能不登录直接拉取
#   密钥 ACR_USERNAME、ACR_PASSWORD   阿里云容器镜像服务的登录账号与固定密码
# 只发布 linux/amd64。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本（与 VERSION 一致，例如 v0.0.1）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # 与 deploy/docker-compose.yml 里 postgres、redis、rustfs 的默认镜像一致；改版本时两处一起改（下面有检查）
  MIRRORS: >-
    docker.io/library/postgres:17.6-alpine=postgres:17.6-alpine
    docker.io/library/redis:7.4.2-alpine=redis:7.4.2-alpine
    docker.io/rustfs/rustfs:1.0.0-beta.7=rustfs-rustfs:1.0.0-beta.7

jobs:
  check:
    name: 发布前检查
    if: vars.ACR_REGISTRY != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 标签与 VERSION 一致
        run: |
          test "$(cat VERSION)" = "$TAG" || { echo "标签 $TAG 与 VERSION（$(cat VERSION)）不一致"; exit 1; }
          grep -q "KNOWWORK_VERSION=$TAG" deploy/.env.example || { echo "deploy/.env.example 的版本不是 $TAG，先跑 scripts/bump_version.py"; exit 1; }
      - name: 同步列表与 compose 默认值一致
        run: |
          for pair in $MIRRORS; do
            target="${pair#*=}"
            grep -q "/$target}" deploy/docker-compose.yml || { echo "docker-compose.yml 里没有 $target，同步列表过期了"; exit 1; }
          done
      - name: 本版说明（取 CHANGELOG 里这一节）
        run: |
          awk -v tag="$TAG" '$0 ~ "^## \\[?" tag "\\]?" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md 里没有 $TAG 这一节"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  images:
    name: 镜像 ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [server, runtime-host, gateway, sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 取仓库主机名（ACR_REGISTRY 带命名空间，登录只要主机）
        run: echo "REGISTRY_HOST=${ACR_REGISTRY%%/*}" >> "$GITHUB_ENV"
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.name }}.Dockerfile
          platforms: linux/amd64
          push: true
          # 阿里云个人版不认 buildx 默认附带的来源证明（OCI 空配置清单），推送会报 unknown manifest class；
          # 关掉它，推普通的镜像清单。依赖与许可证清单由下面单独生成的 SBOM 提供
          provenance: false
          sbom: false
          build-args: KNOWWORK_VERSION=${{ env.TAG }}
          tags: |
            ${{ vars.ACR_REGISTRY }}/knowwork-${{ matrix.name }}:${{ env.TAG }}
            ${{ vars.ACR_REGISTRY }}/knowwork-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: 生成 SBOM（依赖与许可证清单）
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.ACR_REGISTRY }}/knowwork-${{ matrix.name }}:${{ env.TAG }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          format: spdx-json
          output-file: knowwork-${{ matrix.name }}-${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: knowwork-${{ matrix.name }}-${{ env.TAG }}.spdx.json

  mirrors:
    name: 同步依赖镜像
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: 取仓库主机名（ACR_REGISTRY 带命名空间，登录只要主机）
        run: echo "REGISTRY_HOST=${ACR_REGISTRY%%/*}" >> "$GITHUB_ENV"
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 原样复制（只取 linux/amd64）
        run: |
          for pair in $MIRRORS; do
            source="${pair%%=*}"; target="${{ vars.ACR_REGISTRY }}/${pair#*=}"
            digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' \
              | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
            docker buildx imagetools create --tag "$target" "${source%%:*}@${digest}"
            echo "已同步 $source → $target"
          done

  release:
    name: GitHub Release
    needs: [images, mirrors]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: KnowWork ${{ env.TAG }}
          body_path: artifacts/notes.md
          files: artifacts/*.spdx.json
