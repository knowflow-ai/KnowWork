# 会话沙箱（默认打开）：api 直接连本机 Docker daemon，按会话创建沙箱容器，模型发起的命令与文件读写都落在里面，
# 碰不到这台服务器上的数据库连接、密钥和别人的数据。worker 也连同一个 daemon：附件解析出的 Markdown 要放进会话容器。
#
# 挂 docker.sock 等于给了 api、worker 宿主机 root，只用于私有化单机部署。不需要沙箱时，把 .env 里的
# COMPOSE_FILE 改成只有 docker-compose.yml（install.sh --no-sandbox 会替你改）；这时模型不能执行命令，
# 也生成不了 Word、Excel 这类文件。连远端 daemon 的做法见 .env.example。
services:
  api:
    environment:
      KNOWWORK_SANDBOX_DOCKER_ENABLED: ${KNOWWORK_SANDBOX_DOCKER_ENABLED:-true}
      # 流式执行（默认关）：见 .env.example
      KNOWWORK_SANDBOX_SSH_ENABLED: ${KNOWWORK_SANDBOX_SSH_ENABLED:-false}
      # 个人专属宿主（默认关，见 .env.example）：用了上传插件的人，云端对话跑在他自己的宿主容器里。
      # 容器由 api 经同一个 Docker 创建，用宿主的镜像、接在宿主那张内部网络上，回调与调模型的地址同 runtime-host
      KNOWWORK_PLUGIN_HOSTS: ${KNOWWORK_PLUGIN_HOSTS:-off}
      KNOWWORK_PLUGIN_HOST_IMAGE: ${KNOWWORK_PLUGIN_HOST_IMAGE:-${KNOWWORK_REGISTRY:-crpi-6q638zy09wmnj70w.cn-hangzhou.personal.cr.aliyuncs.com/knowflow-ai}/knowwork-runtime-host:${KNOWWORK_VERSION:-v0.1.4}}
      KNOWWORK_PLUGIN_HOST_NETWORK: ${KNOWWORK_PLUGIN_HOST_NETWORK:-knowwork_host-link}
      KNOWWORK_PLUGIN_HOST_CALLBACK_URL: http://api:8001
      KNOWWORK_PLUGIN_HOST_MODEL_BASE_URL: http://model-gateway:8002/internal/model/v1
      KNOWWORK_PLUGIN_HOST_MAX: ${KNOWWORK_PLUGIN_HOST_MAX:-50}
      KNOWWORK_PLUGIN_HOST_IDLE_SECONDS: ${KNOWWORK_PLUGIN_HOST_IDLE_SECONDS:-600}
      KNOWWORK_PLUGIN_HOST_RETENTION_DAYS: ${KNOWWORK_PLUGIN_HOST_RETENTION_DAYS:-90}
      KNOWWORK_PLUGIN_HOST_MEMORY_MB: ${KNOWWORK_PLUGIN_HOST_MEMORY_MB:-768}
    volumes:
      - ${KNOWWORK_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
  worker:
    environment:
      KNOWWORK_SANDBOX_DOCKER_ENABLED: ${KNOWWORK_SANDBOX_DOCKER_ENABLED:-true}
      # 必须与 api 一致：流式执行改容器姿态，两边不一致会互相把对方建的容器删掉重建（工作区清空）
      KNOWWORK_SANDBOX_SSH_ENABLED: ${KNOWWORK_SANDBOX_SSH_ENABLED:-false}
      # 开了个人专属宿主时，上传的插件在 worker 里试装：起一个一次性的宿主容器加载一遍，和 api 用同一套配置
      KNOWWORK_PLUGIN_HOSTS: ${KNOWWORK_PLUGIN_HOSTS:-off}
      KNOWWORK_PLUGIN_HOST_IMAGE: ${KNOWWORK_PLUGIN_HOST_IMAGE:-${KNOWWORK_REGISTRY:-crpi-6q638zy09wmnj70w.cn-hangzhou.personal.cr.aliyuncs.com/knowflow-ai}/knowwork-runtime-host:${KNOWWORK_VERSION:-v0.1.4}}
      KNOWWORK_PLUGIN_HOST_NETWORK: ${KNOWWORK_PLUGIN_HOST_NETWORK:-knowwork_host-link}
      KNOWWORK_PLUGIN_HOST_CALLBACK_URL: http://api:8001
      KNOWWORK_PLUGIN_HOST_MODEL_BASE_URL: http://model-gateway:8002/internal/model/v1
      KNOWWORK_PLUGIN_HOST_MEMORY_MB: ${KNOWWORK_PLUGIN_HOST_MEMORY_MB:-768}
    volumes:
      - ${KNOWWORK_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
