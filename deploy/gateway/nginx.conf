# KnowWork 网关：前端静态文件 + 业务服务公开端口的反向代理。
# 只转发 api 的公开端口（8000）；内部端口（8001，宿主回调）一律不转发。

upstream knowwork_api {
    server api:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 网关自身的存活探针，不依赖后端
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 业务服务的存活与就绪探针（安装脚本轮询 /ready）
    location = /health {
        access_log off;
        proxy_pass http://knowwork_api/health;
    }
    location = /ready {
        access_log off;
        proxy_pass http://knowwork_api/ready;
    }

    # 内部接口不经网关暴露（即使公开端口上误挂了也拦在这里）
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://knowwork_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 事件流（SSE）不缓冲，长连接不因空闲被切断（宿主与业务服务都有心跳）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 带哈希的构建产物长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # nginx 自带的类型表里没有 .mjs（pdf.js 的 worker 是 .mjs），会按 application/octet-stream 返回；
        # 加上 nosniff，浏览器拒绝把它当模块脚本加载，PDF 预览打不开。只在这里补 mjs：
        # 在外层写 types 会把整张类型表换掉，css、图片、字体都会丢类型
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }

    # 单页应用：未知路径回到 index.html，且不缓存入口
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
