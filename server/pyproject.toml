[project]
name = "knowwork-server"
version = "0.0.2"
description = "KnowWork 业务服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "cryptography>=50.0.2",
  "sse-starlette>=3.5.0",
  "argon2-cffi>=25.1.0",
  "authlib>=1.9.1",
  "joserfc>=1.7.7",
  "casbin>=1.43.0",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "boto3>=1.35",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1.5",
  "docker>=7.2",
  "mcp>=1.20",
  "redis>=5.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "anyio>=4.6",
  "pgserver>=0.1.4",
  "ruff>=0.8",
  "pytest-cov>=7.1.0",
  "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowwork_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# SQLAlchemy 的 async 会话跑在 greenlet 里，不声明会把 await 之后的行误报为未覆盖。
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 120
target-version = "py312"
